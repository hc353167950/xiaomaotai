name: Auto Tag and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/keep_alive_heartbeat.json'
      - '.github/workflows/keep_alive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # keep-alive 机器人提交不打 tag / release
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, 'keep_alive') && !contains(github.event.head_commit.message, 'heartbeat')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          if [ -z "${VERSION_NAME}" ]; then VERSION_NAME="0.0.0"; fi
          if [ -z "${VERSION_CODE}" ]; then VERSION_CODE="0"; fi

          DATE_TAG=$(TZ=Asia/Shanghai date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${VERSION_NAME}-${DATE_TAG}-${SHORT_SHA}"

          # HEAD 已有 tag 则复用
          if EXISTING=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            TAG="${EXISTING}"
            echo "reuse_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse_tag=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "short_sha=${SHORT_SHA}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Tag: ${TAG}"
          echo "versionName: ${VERSION_NAME} versionCode: ${VERSION_CODE}"

      - name: Create and push tag
        if: steps.meta.outputs.reuse_tag != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag already exists remotely/local: ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Auto release ${TAG}

          versionName: ${VERSION_NAME}
          commit: ${GITHUB_SHA}
          actor: ${GITHUB_ACTOR}
          "
          git push origin "refs/tags/${TAG}"
          echo "Created tag: ${TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android@v3 内部会执行 `sdkmanager tools`，而新版 cmdline-tools 已移除该包，
      # 会以 exit 1 失败。因此不再使用该 action，改为直接用 runner 预装的 Android SDK
      # （ubuntu-latest 已自带 cmdline-tools 与 platforms），只补齐本项目需要的版本。
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # runner 预装 SDK，定位 sdkmanager
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "${SDKMGR}" ]; then
            SDKMGR="$(find "${SDK_ROOT}" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "${SDKMGR}" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          echo "Using sdkmanager: ${SDKMGR}"

          yes | "${SDKMGR}" --licenses >/dev/null 2>&1 || true
          # 只安装项目必需项；已安装的会跳过
          "${SDKMGR}" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

          echo "=== Installed platforms ==="
          ls "${SDK_ROOT}/platforms" || true
          echo "=== Installed build-tools ==="
          ls "${SDK_ROOT}/build-tools" || true

      - name: Write local.properties
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          echo "sdk.dir=${SDK_ROOT}" > local.properties
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle.properties 在 .gitignore 中（历史上存放签名密码），CI 检出后缺失。
      # 这里生成一份不含密码的配置，并针对 CI 网络环境调优依赖拉取：
      # - Maven Central 对共享 runner IP 会返回 429，需容忍并重试
      # - 延长连接/读取超时，避免偶发慢速直接失败
      - name: Generate gradle.properties
        run: |
          set -euo pipefail
          if [ ! -f gradle.properties ]; then
            cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.parallel=true
          org.gradle.caching=true
          # CI 依赖拉取容错
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=8
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF
            echo "Generated gradle.properties"
            cat gradle.properties
          fi

      # 缓存 Gradle 依赖，减少重复下载（也显著降低 429 概率）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore (optional)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ]; then
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > app/xiaomaotai-release-key.jks
            echo "has_release_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded"
          else
            echo "has_release_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secrets; will publish debug APK only"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: steps.keystore.outputs.has_release_keystore == 'true'
        env:
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts
        id: artifacts
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          HAS_RELEASE: ${{ steps.keystore.outputs.has_release_keystore }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          FILES=()

          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "${DEBUG_APK}" ]; then
            OUT="dist/release/xiaomaotai-${VERSION_NAME}-debug-${TAG}.apk"
            cp "${DEBUG_APK}" "${OUT}"
            FILES+=("${OUT}")
            echo "debug_apk=${OUT}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${HAS_RELEASE}" = "true" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1 || true)
            if [ -n "${RELEASE_APK}" ]; then
              OUT="dist/release/xiaomaotai-${VERSION_NAME}-release-${TAG}.apk"
              cp "${RELEASE_APK}" "${OUT}"
              FILES+=("${OUT}")
              echo "release_apk=${OUT}" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No APK artifacts found" >&2
            exit 1
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          ls -lh dist/release/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          HAS_RELEASE: ${{ steps.keystore.outputs.has_release_keystore }}
        run: |
          set -euo pipefail

          # 已有同名 Release 则先删掉再重建（同 tag 重跑）
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists, deleting..."
            gh release delete "${TAG}" --yes
          fi

          NOTES="## 小茅台 ${VERSION_NAME}

          - **Tag**: \`${TAG}\`
          - **versionName**: ${VERSION_NAME}
          - **versionCode**: ${VERSION_CODE}
          - **Commit**: ${GITHUB_SHA}
          - **SHA**: ${SHORT_SHA}

          ### 安装包
          - 已附带 **debug** APK，可直接安装调试
          "

          if [ "${HAS_RELEASE}" = "true" ]; then
            NOTES="${NOTES}
          - 已附带 **release** 签名 APK
          "
          else
            NOTES="${NOTES}
          - 未配置 release 签名 secrets，本次仅上传 debug APK
          - 需要正式包时在仓库 Secrets 配置：
            - \`RELEASE_KEYSTORE_BASE64\`（jks 的 base64）
            - \`RELEASE_STORE_PASSWORD\`
            - \`RELEASE_KEY_PASSWORD\`
          "
          fi

          mapfile -t ASSETS < <(find dist/release -name "*.apk" | sort)

          gh release create "${TAG}" \
            --title "v${VERSION_NAME} (${TAG})" \
            --notes "${NOTES}" \
            "${ASSETS[@]}"

          echo "Release created: ${TAG}"
          for f in "${ASSETS[@]}"; do echo "  - $f"; done
